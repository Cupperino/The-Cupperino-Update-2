  ENG_mio_trait_supermarine:0 "High Agility Aircraft Designer"
  ENG_mio_trait_thicker_armour:0 "Thicker Armour"
  ENG_mio_trait_thicker_armour_desc:0 "Heavier armour plating for our battleships."
  ENG_mio_trait_portsmouth_refits:0 "Portsmouth Refits"
  ENG_mio_trait_portsmouth_refits_desc:0 "His Majesty's Dockyard at Portsmouth brings its long experience of rebuilding warships to bear on our conversion work."
  ENG_mio_trait_hunter_armament:0 "Messerschmitt Hunters"
  ENG_mio_trait_hunter_armament_desc:0 "Cannon armament and refined control surfaces give our fighters the punch and the agility to bring down German aircraft."
  ENG_mio_trait_sustained_bombing:0 "Sustained Bombing"
  ENG_mio_trait_sustained_bombing_desc:0 "Heavier bomb loads and improved bombsights for our strategic bombers."

