  ### UK REWORK PHASE 1 - PLACEHOLDER STUBS (not yet implemented, see Engerland.drawio) ###
  ENG_a_domestic_tank_program:0 "A Domestic Tank Program"
  ENG_a_domestic_tank_program_desc:0 "Britain's tanks will be built in British factories to British designs. J. F. C. Fuller, the prophet of armoured warfare the War Office has ignored for years, will finally be heard."
  ENG_a_meteor_across_the_sky:0 "A Meteor Across the Sky"
  ENG_a_meteor_across_the_sky_desc:0 "Frank Whittle has a jet engine running on the test bench at Lutterworth. Gloster is ready to build a fighter around it, one that will streak across the sky faster than any propeller-driven aircraft."
  ENG_a_need_for_arms:0 "A Need for Arms"
  ENG_a_need_for_arms_desc:0 "Our soldiers will need rifles, mortars and radios by the million. Simplified patterns and bulk contracts will make every piece of kit cheaper to turn out."
  ENG_a_second_naval_race:0 "A Second Naval Race"
  ENG_a_second_naval_race_desc:0 "The naval treaties are crumbling, and Japan, Germany and Italy are laying down new hulls. The yards of the Mersey and the Clyde will race them, and they will not lose."
  ENG_all_in:0 "All In"
  ENG_all_in_desc:0 "With war looming, half-measures will no longer do. The government will throw its full weight behind industry and science alike."
  ENG_anglo_canadian_economic_interdependence:0 "Anglo-Canadian Interdependence"
  ENG_anglo_canadian_economic_interdependence_desc:0 "Canada sits beyond the reach of enemy bombers, next door to American industry and on our side of the Atlantic. Factories built there will give the Empire a second arsenal."
  ENG_anglo_german_naval_treaty:0 "Anglo-German Naval Treaty"
  ENG_anglo_german_naval_treaty_desc:0 "By agreeing to let Germany rebuild its navy within fixed limits, we can keep the Kriegsmarine from challenging the Royal Navy's battle fleet, while Berlin keeps its cruisers, U-boats and destroyers."
  ENG_anglo_german_naval_treaty_tt:0 "§Y[GER.GetNameDef]§! will choose whether to accept the naval agreement:"
  ENG_anglo_german_naval_treaty_accept_tt:0 "If they §Gaccept§!:"
  ENG_anglo_german_naval_treaty_refuse_tt:0 "If they §Rrefuse§!:"
  ENG_anglo_german_naval_agreement:0 "Anglo-German Naval Agreement"
  ENG_anglo_german_naval_agreement_desc:0 "Under the terms agreed with Britain, the tonnage of our battle fleet is strictly limited, making every new battleship a costly undertaking. The agreement ends if we go to war with Britain."
  ENG_appease_scottish_industrialists:0 "Boost Domestic Production"
  ENG_appease_scottish_industrialists_desc:0 "New arms works in the industrial heartland of Scotland will put idle foundries and yards back to work for rearmament."
  ENG_aquire_next_generation_bombers:0 "Acquire Next Generation Bombers"
  ENG_aquire_next_generation_bombers_desc:0 "Twin-engined bombers will never carry enough to break the Reich. Specifications for four-engined heavies are on the Air Ministry's desk, and Short, Handley Page and Avro are eager to build them."
  ENG_arms_exports_from_bohemia:0 "Arms Exports from Bohemia"
  ENG_arms_exports_from_bohemia_desc:0 "Berlin offers a bargain: British machinery and raw materials in exchange for a share of the arms trade flowing out of central Europe. It will keep our factories busy, though German industry will profit just as much."
  ENG_award_supermarine_with_subsidies:0 "Award Supermarine with Subsidies"
  ENG_award_supermarine_with_subsidies_desc:0 "Supermarine's Woolston works cannot keep up with the orders already on its books. Generous subsidies will let the company expand and keep its design office a step ahead of Messerschmitt."
  ENG_begin_spiteful_research:0 "Begin Spiteful Research"
  ENG_begin_spiteful_research_desc:0 "Supermarine believes the Spitfire's elliptical wing has reached its limit. A new laminar-flow wing could carry its successor, the Spiteful, faster than any piston fighter yet flown."
  ENG_birmingham_small_arms:0 "Birmingham Small Arms"
  ENG_birmingham_small_arms_desc:0 "Birmingham Small Arms has built rifles for the British soldier for nearly a century. Expanding its works and its design office will arm the growing army with better infantry weapons."
  ENG_blot_out_the_sun_with_bombs:0 "Blot Out the Sun with Bombs"
  ENG_blot_out_the_sun_with_bombs_desc:0 "Let the enemy boast that his bombers will blot out the sun; then our fighters will fight in the shade. Escort pilots will learn to stay with the bombers all the way to the target and back."
  ENG_bring_the_war_to_german_homes:0 "Bring the War to German Homes"
  ENG_bring_the_war_to_german_homes_desc:0 "Daylight raids cost too many crews. Our bombers will strike by night, guided by new navigation aids and the flares of pathfinder crews, and bring the war home to those who started it."
  ENG_cash_and_carry:0 "Cash and Carry"
  ENG_cash_and_carry_desc:0 "The Americans will sell us anything, provided we pay up front and carry it home in our own ships. When the gold runs low, we will borrow to keep the cargoes coming."
  ENG_centralized_military_command:0 "Centralized Military Command"
  ENG_centralized_military_command_desc:0 "Rather than wait on the dominions, London will take charge of the Empire's war production and place the orders itself. Standard patterns and single contracts will make every rifle and gun cheaper to build."
  ENG_challenge_german_rearmament:0 "Challenge German Rearmament"
  ENG_challenge_german_rearmament_desc:0 "Germany is rearming openly and in defiance of the treaties. We will answer it factory for factory, giving new arms works priority across the country."
  ENG_commission_the_lion_class:0 "Commission the Lion-Class"
  ENG_commission_the_lion_class_desc:0 "The Admiralty's most ambitious battleship design is ready to leave the drawing board. Two hulls will be laid down immediately, already well advanced in construction."
  ENG_commonwealth_armour_development:0 "Commonwealth Armour Development"
  ENG_commonwealth_armour_development_desc:0 "Tanks need not come only from British factories. Sharing our designs with the dominions will let Canadian, Australian and South African lines turn out armour of their own."
  ENG_commonwealth_military_attaches:0 "Commonwealth Military Attaches"
  ENG_commonwealth_military_attaches_desc:0 "Officers from Ottawa, Canberra and Pretoria will join our staffs and our embassies abroad. What they learn will flow back to their own armies and teach the dominion forces to think as one."
  ENG_commonwealth_research_exchange_programs:0 "Commonwealth Research Programs"
  ENG_commonwealth_research_exchange_programs_desc:0 "The National Research Council of Canada and Australia's CSIR are full of bright minds working in isolation. Pooling their work with ours through joint councils and exchanges will speed up research across the Commonwealth."
  ENG_commonwealth_supreme_command:0 "Commonwealth Supreme Command"
  ENG_commonwealth_supreme_command_desc:0 "Commonwealth armies fighting on a dozen fronts need a single hand to direct them. Combined Operations will plan the great offensives, and commanders such as Montgomery and Slim will be given the means to carry them out."
  ENG_continue_free_trade:0 "Continue Free Trade"
  ENG_continue_free_trade_desc:0 "Trade with Germany keeps British factories busy and British workers employed. As long as the goods keep flowing, there is no reason to close the door."
  ENG_death_or_glory:0 "Death or Glory"
  ENG_death_or_glory_desc:0 "'Death or Glory' runs the motto of the 17th Lancers, and the army must recover that spirit. The War Office will shake the dust off its doctrines and give its officers room to think about the next war."
  ENG_deepen_anglo_german_trade_ties:0 "Deepen Anglo-German Trade Ties"
  ENG_deepen_anglo_german_trade_ties_desc:0 "German industry is hungry for British coal, wool and colonial goods, and the City is happy to lend. Closer commercial ties will bring money into the country while the peace lasts."
  ENG_develop_the_jewel_of_the_empire:0 "Develop the Jewel of the Empire"
  ENG_develop_the_jewel_of_the_empire_desc:0 "India's millions and its untapped riches could make it the industrial heart of the East. Investment in Bombay's mills and the steelworks of Jamshedpur will put the Jewel of the Empire to work."
  ENG_develop_the_spitfire:0 "Develop the Spitfire"
  ENG_develop_the_spitfire_desc:0 "R. J. Mitchell's sleek fighter promises to outclimb and outturn anything in the sky. The Air Ministry will order it from Supermarine and rush it into service."
  ENG_domestic_affairs_of_the_commonwealth:0 "Domestic Affairs of the Commonwealth"
  ENG_domestic_affairs_of_the_commonwealth_desc:0 "Under the Statute of Westminster the dominions govern themselves as equals of the Crown. Supporting their governments and opening their markets to one another will keep the Commonwealth pulling in the same direction."
  ENG_embargo_the_italians:0 "Embargo the Italians"
  ENG_embargo_the_italians_desc:0 "Mussolini has swallowed Abyssinia while the League looked on. Where Geneva's sanctions failed, ours will not, though not everyone at home will welcome the confrontation."
  ENG_end_of_the_beginning:0 "End of the Beginning"
  ENG_end_of_the_beginning_desc:0 "The phoney war is over and the government has lost the confidence of the House. Winston Churchill will lead a coalition that puts the whole nation on a war footing, with nothing to offer but blood, toil, tears and sweat."
  ENG_establish_the_raf_fighter_command:0 "Establish the RAF Fighter Command"
  ENG_establish_the_raf_fighter_command_desc:0 "Radar stations, sector control rooms and fighter squadrons tied into one system will let us meet every raid over Britain before it reaches its target."
  ENG_europe_in_shadow:0 "Europe in Shadow"
  ENG_europe_in_shadow_desc:0 "Across the Channel, the lamps are going out one by one. The government will rally the nation behind it while Britain decides how to face the dictators."
  ENG_expand_the_strategic_reserve:0 "Expand the Strategic Reserve"
  ENG_expand_the_strategic_reserve_desc:0 "A fleet without oil is a fleet tied to its moorings. New tank farms across the country and fresh dockyards in Scotland and the north will keep the Navy fuelled and repaired however long the war lasts."
  ENG_expand_vickers_armstrong:0 "Expand Vickers-Armstrong"
  ENG_expand_vickers_armstrong_desc:0 "Vickers-Armstrongs has built tanks for half the world's armies. Expanding its Elswick works will give our cruiser tanks the speed and firepower to outfight anything they meet."
  ENG_fire_and_fury:0 "Fire and Fury"
  ENG_fire_and_fury_desc:0 "Our strike squadrons are learning their trade over land and sea alike. Bringing that experience together will forge a single school of air attack that hits harder with every sortie."
  ENG_not_a_penny_wasted:0 "Not a Penny Wasted"
  ENG_not_a_penny_wasted_desc:0 "Rather than laying down costly new hulls, the Admiralty can modernise the ships it already has. The chance passes once the new construction programmes take hold in the summer of 1938."
  ENG_focus_on_infantry_support_tanks:0 "Focus on Infantry Support Tanks"
  ENG_focus_on_infantry_support_tanks_desc:0 "Vauxhall has a design for a slow, heavily armoured tank to walk alongside the infantry and shrug off anti-tank fire. Some at the War Office already want to name it after a certain backbencher."
  ENG_fortify_the_mediterranean:0 "Fortify the Mediterranean"
  ENG_fortify_the_mediterranean_desc:0 "Gibraltar and Malta are the keys to the Mediterranean. The Rock will be tunnelled and armed, Malta's airfields expanded, and the approaches to both sown with mines."
  ENG_foundations_of_the_sas:0 "Foundations of the SAS"
  ENG_foundations_of_the_sas_desc:0 "Our elite forces must grow beyond the occasional commando raid. A lanky Scots Guards lieutenant on crutches has just climbed the wire into GHQ to put his plan for a small parachute raiding unit directly before the generals. If they don't throw him out, they may give him the men to try it."
  ENG_front_occidental:0 "Front Occidental"
  ENG_front_occidental_desc:0 "France is our first line of defence. We will throw our political weight behind Paris and help its arms industry prepare, so that the Western Front holds this time."
  ENG_ground_support_specialization:0 "Ground Support Specialization"
  ENG_ground_support_specialization_desc:0 "Our light bomber crews will specialise in the enemy's front line: his columns, bridges and gun lines. Training alongside the army, they will learn to put their bombs where the troops need them."
  ENG_guarantee_south_african_sovereignty:0 "Guarantee South African Sovereignty"
  ENG_guarantee_south_african_sovereignty_desc:0 "Hertzog's government guards South Africa's independence jealously. By respecting it openly and investing in the Rand's mines and factories, we will keep Pretoria a willing partner rather than a reluctant one."
  ENG_his_majesty_s_dockyard_portsmouth:0 "His Majesty's Dockyard Portsmouth"
  ENG_his_majesty_s_dockyard_portsmouth_desc:0 "Portsmouth Dockyard has refitted the fleet since the age of sail. Putting its experience at the service of our ship designers will get modernised ships back to sea faster."
  ENG_hobart_s_funnies:0 "Hobart's Funnies"
  ENG_hobart_s_funnies_desc:0 "Major-General Percy Hobart turns ordinary tank hulls into specialised engineering vehicles: mine flails, bridge-layers, flamethrowers and swimming tanks. Standardising those conversions keeps our amphibious tanks and armoured support vehicles cheap to build."
  ENG_hunt_the_messerschmitt:0 "Hunt the Messerschmitt"
  ENG_hunt_the_messerschmitt_desc:0 "Our fighters must be able to catch and kill the best the Luftwaffe can send. Supermarine will give the Spitfire heavier guns and a tighter turn."
  ENG_imperial_resource_extraction:0 "Imperial Resource Extraction"
  ENG_imperial_resource_extraction_desc:0 "Bauxite in Ontario, chromium in Natal, rubber in Ceylon, oil in Borneo and tungsten in Queensland: the Empire holds everything a modern war consumes. It only needs to be dug up and shipped home."
  ENG_improve_global_trade:0 "Improve Global Trade"
  ENG_improve_global_trade_desc:0 "P&O and the great shipping lines carry the Empire's trade across every ocean. Cheaper freight and new routes will bring more business into British ports and more ships under the Red Ensign."
  ENG_increase_bomber_research_funding:0 "Increase Bomber Research Funding"
  ENG_increase_bomber_research_funding_desc:0 "Bristol, Fairey and de Havilland all have designs for faster light bombers on the drawing board. More money for their design offices will give the army the air support it keeps asking for."
  ENG_increase_material_mixing:0 "Increase Material Mixing"
  ENG_increase_material_mixing_desc:0 "Aluminium is scarce and expensive. Mixing in steel tube, wood and fabric wherever the airframe allows, as Hawker does with its Hurricane, will stretch our materials over far more fighters."
  ENG_increase_research_grants:0 "Increase Research Grants"
  ENG_increase_research_grants_desc:0 "Watson-Watt's radio location experiments at Bawdsey show what British science can do with proper funding. Larger grants will put more scientists to work on the problems of the coming war."
  ENG_infrastructural_development:0 "Infrastructural Development"
  ENG_infrastructural_development_desc:0 "New arterial roads, electrified railways and the National Grid will knit the country together. Wherever the pylons reach, industry can follow."
  ENG_involve_the_furniture_manufacturers_in_t:0 "Involve Furniture Manufacturers"
  ENG_involve_the_furniture_manufacturers_in_t_desc:0 "The furniture makers of High Wycombe know more about shaping wood than any aircraft firm. Bringing them into the industry will free metal and skilled fitters for the fighter lines."
  ENG_larp_focus_for_the_mosquito:0 "Begin developing Mossie"
  ENG_larp_focus_for_the_mosquito_desc:0 "De Havilland proposes a fast unarmed bomber built almost entirely of wood, too quick for any fighter to catch. Sceptics at the Air Ministry already call it Freeman's Folly, but the company is ready to build it anyway."
  ENG_learn_from_the_rats_of_tobruck:0 "Learn from the Rats of Tobruk"
  ENG_learn_from_the_rats_of_tobruck_desc:0 "Let enemy broadcasters call our desert garrisons rats; rats know how to survive in the sand. Every clash with the Italians teaches our tank crews where the ground will bear a tank and how to keep engines running in the dust, and those lessons must reach every armoured regiment."
  ENG_tobruk_desert_armour:0 "Lessons of Tobruk"
  ENG_tobruk_desert_armour_desc:0 "Desert fighting experience gathered during the siege of Tobruk, taught to our tank crews."
  ENG_legacy_of_the_industrial_revolution:0 "Legacy of the Industrial Revolution"
  ENG_legacy_of_the_industrial_revolution_desc:0 "Britain was the first workshop of the world, and its roads, railways and canals still carry the nation's trade. Leslie Hore-Belisha, the man behind the beacons at our crossings, will drive the modernisation of the network."
  ENG_lessons_from_france:0 "Lessons from France"
  ENG_lessons_from_france_desc:0 "The Battle of France has taught our army hard lessons in modern warfare. By sharing what we have learned with the dominions, their armies can be spared the price we paid for it."
  ENG_let_bomber_harris_loose:0 "Let 'Bomber' Harris Loose"
  ENG_let_bomber_harris_loose_desc:0 "Arthur Harris believes the bomber can break the enemy's will to fight. Give him a seat in the high command and he will prove it."
  ENG_losing_the_battle_winning_the_war:0 "Losing the Battle, Winning the War"
  ENG_losing_the_battle_winning_the_war_desc:0 "Factories can be rebuilt; time cannot. Machine tools will be pulled off today's production lines to equip tomorrow's factories, trading output now for a bigger arsenal later."
  ENG_modern_shipbuilding:0 "Modern Shipbuilding"
  ENG_modern_shipbuilding_desc:0 "Welding, prefabricated sections and modern cranes will let our yards build faster and cheaper than the riveting gangs ever could."
  ENG_open_up_the_royal_arsenal:0 "Open up the Royal Arsenal"
  ENG_open_up_the_royal_arsenal_desc:0 "The workshops at Woolwich have made the army's guns for centuries. Modernised, they will turn out cheaper guns and better shells for our field and anti-aircraft batteries alike."
  ENG_operation_dracula:0 "Operation Dracula"
  ENG_operation_dracula_desc:0 "With the Japanese advance halted, Commonwealth forces can plan an amphibious assault to retake Burma from the sea."
  ENG_operation_overlord:0 "Operation Overlord"
  ENG_operation_overlord_desc:0 "The liberation of Europe begins on the beaches of France. Every Allied nation will throw its weight behind the greatest seaborne invasion in history."
  ENG_operation_torch:0 "Operation Torch"
  ENG_operation_torch_desc:0 "Anglo-American landings in French North Africa will open a second front against the Axis and bring Vichy's colonies into the war on our side."
  ENG_leave_readmitted_naval_treaty:0 "Withdraw from the Naval Treaties"
  ENG_leave_readmitted_naval_treaty_desc:0 "We rejoined the naval treaties at British urging, but their limits no longer serve our interests. We must be free to build the fleet our security demands."
  ENG_operation_compass:0 "Operation Compass"
  ENG_operation_compass_desc:0 "The Western Desert Force is ready to strike at the Italian army in Libya. A swift offensive could drive the Italians from Cyrenaica before they can reinforce."
  ENG_combined_operations:0 "Combined Operations"
  ENG_combined_operations_desc:0 "The Commonwealth's combined staff can launch major operations once the forces are ready. Each operation can be launched only once, so the timing is ours to choose."
  ENG_launch_operation_compass:0 "Launch Operation Compass"
  ENG_launch_operation_compass_desc:0 "Strike at the Italian army in Libya."
  ENG_launch_operation_torch:0 "Launch Operation Torch"
  ENG_launch_operation_torch_desc:0 "Land in French North Africa and open a second front against the Axis."
  ENG_launch_operation_dracula:0 "Launch Operation Dracula"
  ENG_launch_operation_dracula_desc:0 "Retake Burma from the sea."
  ENG_launch_operation_overlord:0 "Launch Operation Overlord"
  ENG_launch_operation_overlord_desc:0 "Begin the liberation of Europe on the beaches of France."
  ENG_no_operation_in_progress_tt:0 "No other §YCombined Operation§! is under way"
  ENG_originator_of_the_tank:0 "Originator of the Tank"
  ENG_originator_of_the_tank_desc:0 "It was British engineers who first sent a 'landship' across no man's land. The tank is our invention, and we will build its next generation before anyone else does."
  ENG_outfit_the_british_expeditionary_force:0 "The Troop Carrier"
  ENG_outfit_the_british_expeditionary_force_desc:0 "Infantry on foot cannot keep pace with modern armour. Carrying our riflemen in tracked and wheeled carriers will let whole divisions move and fight together."
  ENG_phase_out_the_shrapnel:0 "Phase Out the Shrapnel"
  ENG_phase_out_the_shrapnel_desc:0 "Shrapnel shells are useless against men in modern cover. The Royal Artillery will switch to high explosive and to new guns such as the 25-pounder."
  ENG_pioneer_interventionist_economics:0 "Pioneer Interventionist Economics"
  ENG_pioneer_interventionist_economics_desc:0 "The old Treasury creed of balanced budgets has run its course. The state will take a direct hand in the economy, financing new factories and steering investment where the country needs it most."
  ENG_prepare_for_the_inevitable:0 "Prepare for the Inevitable"
  ENG_prepare_for_the_inevitable_desc:0 "After the Sudeten crisis nobody in Whitehall still believes war can be avoided. Industry must be put on a footing to fight it, and the arms works must go up faster."
  ENG_radio_development:0 "Radio Development"
  ENG_radio_development_desc:0 "Reliable radio links between tanks, guns and headquarters will decide the next war. Our laboratories and manufacturers will make them a priority."
  ENG_invite_exile_aces:0 "Invite Exile Aces"
  ENG_invite_exile_aces_desc:0 "Airmen who escaped the fall of Poland and Czechoslovakia have made their way to our shores, determined to keep fighting. Welcoming them into the Royal Air Force brings seasoned combat pilots into our squadrons, and every one of them has a score to settle."
  ENG_readmit_italy_into_the_naval_treaties:0 "Readmit Italy into the Naval Treaties"
  ENG_readmit_italy_into_the_naval_treaties_desc:0 "Italy has walked away from the naval treaties, and our embargo already weighs on its economy. By offering to lift it in exchange for Italy's return to the treaty system, we can either restrain the Italian fleet or free ourselves of limits that Rome no longer honours."
  ENG_readmit_italy_into_the_naval_treaties_tt:0 "§YItaly§! will choose to either rejoin the naval treaties in exchange for the lifting of our embargo, or refuse, allowing us to leave the naval treaty ourselves."
  ENG_italy_left_naval_treaty_tt:0 "Has left the naval treaty"
  ENG_not_bound_by_naval_treaty_tt:0 "Is no longer bound by the naval treaty"
  ENG_reign_in_the_reich:0 "Rein in the Reich"
  ENG_reign_in_the_reich_desc:0 "With the Sudetenland swallowed, Germany has shown that words alone will not restrain it. The Royal Navy will close the sea lanes to German shipping, starving the Reich's war industry of the imports it depends on."
  ENG_reveal_the_scheme:0 "Reveal the Scheme"
  ENG_reveal_the_scheme_desc:0 "The shadow factories can finally step out of the shadows. Their tooling is ready and their workers trained, so turning them over to war production will take a fraction of the usual time."
  ENG_set_fire_to_the_continent:0 "Set Fire to the Continent"
  ENG_set_fire_to_the_continent_desc:0 "The Special Operations Executive will arm, train and supply the resistance movements of occupied Europe. Sabotage, strikes and ambushes will tie down German garrisons and make every conquered state a burden to hold."
  ENG_france_has_capitulated_tt:0 "§Y[FRA.GetNameDef]§! has capitulated at some point"
  ENG_axis_holds_benghazi_tt:0 "§YBenghazi§! is controlled by §Y[ITA.GetNameDef]§! or another §YAxis§! member"
  ENG_axis_holds_casablanca_tt:0 "§YCasablanca§! is controlled by §YVichy France§! or an §YAxis§! member"
  ENG_torch_declare_war_on_vichy_tt:0 "Declares war on §YVichy France§! if it exists and we are not already at war with it."
  ENG_set_fire_to_the_continent_tt:0 "Every non-core state in §YEurope§! controlled by §Y[GER.GetNameDef]§! or its allies"
  ENG_slow_and_steady:0 "Slow and Steady"
  ENG_slow_and_steady_desc:0 "New factories rise across the country, and their managers are told to favour careful, lasting improvements over quick results."
  ENG_special_forces_theory:0 "Special Forces Theory"
  ENG_special_forces_theory_desc:0 "Small units of hand-picked men, trained to strike behind enemy lines, can achieve what whole divisions cannot. The Royal Army will make room for more of them and train them faster."
  ENG_sustained_bombing_campaign:0 "Sustained Bombing Campaign"
  ENG_sustained_bombing_campaign_desc:0 "One raid will not break a nation; a thousand might. Avro's factories will be organised to keep heavy bombers flowing to the squadrons night after night."
  ENG_swarm_the_skies:0 "Swarm the Skies"
  ENG_swarm_the_skies_desc:0 "Whoever holds the skies holds the battle. Our aircraft industry will put fighters first, building them in numbers the enemy cannot match."
  ENG_tackle_the_depression:0 "Tackle the Depression"
  ENG_tackle_the_depression_desc:0 "The Special Areas of Wales, Tyneside and Clydeside still queue at the labour exchange. With rearmament on the horizon, public money will go into new works and finally lift the country out of the slump."
  ENG_tactical_bombing_doctrine:0 "Tactical Bombing Doctrine"
  ENG_tactical_bombing_doctrine_desc:0 "A bomber is worth only what it can hit. Charles Portal will train our crews to strike the enemy's columns, airfields and railheads with precision rather than scatter bombs across the countryside."
  ENG_the_commonwealth_of_nations:0 "The Colonial Empire"
  ENG_the_commonwealth_of_nations_desc:0 "The colonies and dominions give Britain the resources, ports and manpower no rival can match. Binding their trade and industry closer to London will strengthen the whole Empire."
  ENG_the_crossroads_of_history:0 "The Crossroads of History"
  ENG_the_crossroads_of_history_desc:0 "Abroad, the dictators grow bolder; at home, the slump still has its grip on the country. The choices made in Whitehall over the next few years will decide whether Britain meets the coming storm ready or broken."
  ENG_the_french_in_exile:0 "The French in Exile"
  ENG_the_french_in_exile_desc:0 "France has fallen, but its government fights on from our soil. By standing openly behind it, we strengthen its claim to speak for the French nation."
  ENG_the_general_theory_of_employment_interes:0 "Bring in Keynes"
  ENG_the_general_theory_of_employment_interes_desc:0 "John Maynard Keynes argues that government spending can pull the country out of the depression. Bringing him into the Treasury will give his ideas the chance to prove themselves."
  ENG_the_military_industrialization_plan:0 "The Military Industrialization Plan"
  ENG_the_military_industrialization_plan_desc:0 "Every few new civilian works will be matched by a military one. Whitehall's planners will see that as the economy grows, so does the arsenal behind it."
  ENG_the_progenitor_of_industry:0 "The Progenitor of Industry"
  ENG_the_progenitor_of_industry_desc:0 "Britain raised the first factories of the modern age, and it will raise the next. Contractors such as John Laing stand ready to build new works across the country at a pace not seen in a century."
  ENG_the_royal_navy:0 "The Royal Navy"
  ENG_the_royal_navy_desc:0 "The Royal Navy is still the largest fleet in the world, but the treaty years have left it old and stretched thin. The Admiralty must decide how to rebuild it for the war to come."
  ENG_the_shadow_scheme:0 "The Shadow Scheme"
  ENG_the_shadow_scheme_desc:0 "Motor firms such as Austin, Rootes and Rover will run shadow factories built with public money, ready to turn to war work at a moment's notice. The scheme will reach the dominions too, so that new civilian works across the Empire bring military ones with them."
  ENG_the_sun_that_never_set:0 "The Sun that Never Set"
  ENG_the_sun_that_never_set_desc:0 "The sun never sets on the British Empire, yet its distant capitals are poorly linked to the world. Malcolm MacDonald, who knows the dominions better than anyone in Cabinet, will see their roads and harbours brought up to standard."
  ENG_their_finest_hour:0 "Their Finest Hour"
  ENG_their_finest_hour_desc:0 "France has fallen and Britain stands alone. If the Empire lasts a thousand years, men will still say that this was their finest hour."
  ENG_towards_full_employment:0 "Towards Full Employment"
  ENG_towards_full_employment_desc:0 "The dole queues are finally shrinking. With every pair of hands needed for rearmament, no willing worker will be left without a job."
  ENG_turn_germany_into_rubble:0 "Turn Germany into Rubble"
  ENG_turn_germany_into_rubble_desc:0 "Harris has promised to wreck the German war economy from the air. Our heavy bombers will need the range to reach the Ruhr and beyond, and the means to slip past German defences unseen."
  ENG_urbanization_efforts_in_oceania:0 "Urbanization Efforts in Oceania"
  ENG_urbanization_efforts_in_oceania_desc:0 "Australia and New Zealand are vast and thinly settled, their people gathered in a handful of coastal cities. Growing those cities and their industry will make the antipodes a bastion the Empire can rely on in the Pacific."
  ENG_we_ve_beat_them_before:0 "We've beaten them before!"
  ENG_we_ve_beat_them_before_desc:0 "We stood against the Kaiser's armies and won. Reminding the nation, and our soldiers, of that victory will steel them for the fight ahead."
  ENG_pye_organization:0 "Pye Ltd."
  ENG_pacifist_riots:0 "Pacifist Riots"
  ENG_pacifist_riots_desc:0 "With the world at peace, crowds in London and the industrial towns demand to know why Britain still goes out of its way to punish its neighbours. Peace rallies turn into riots, and the government is losing the argument."
  ENG_pacifist_riots_germany_tt:0 "If §YWorld Tension§! falls below §Y[?pacifist_riots_threat|%0]§! while we are not at war with §Y[GER.GetNameDef]§!, pacifists will riot:"
  ENG_pacifist_riots_italy_tt:0 "If §YWorld Tension§! falls below §Y[?pacifist_riots_threat|%0]§! while we embargo §Y[ITA.GetNameDef]§! and are not at war with it, pacifists will riot:"
  britain.717.t:0 "Pacifist Riots"
  britain.717.d_germany:0 "The world has rarely looked calmer, and the public no longer sees why the Royal Navy should be choking German trade. What began as peace rallies in Hyde Park and the northern towns has turned into running battles with the police. Speakers accuse the government of provoking the next war, and the crowds are growing.\n\nThe riots will die down once tensions rise again, or once we are at war with Germany."
  britain.717.d_italy:0 "With Europe at peace, the embargo on Italy looks to many like spite rather than policy. Shipping firms, dockers and churchmen have joined the peace movement in the streets, and several rallies have ended in riots.\n\nThe riots will die down once tensions rise again, once the embargo is lifted, or once we are at war with Italy."
  britain.717.a:0 "His Majesty's Government will not be swayed by the mob."
  ENG_reign_in_the_reich_embargo_tt:0 "Every member of our faction"
  ENG_cash_and_carry_loans_tt:0 "Each use of §YExpand Cash and Carry Purchases§! upgrades the loan: small, then medium, then large. The repayment decision ends the loan for good."
  ENG_the_crowns_men:0 "The Crown's Men"
  ENG_the_crowns_men_desc:0 "The soldiers of the British Army serve the Crown before any party or politician. Their long traditions of discipline, drill and dogged defence are the foundation everything else will be built on."
  ENG_learn_from_the_great_war:0 "Learn from the Great War"
  ENG_learn_from_the_great_war_desc:0 "The trenches of Flanders cost us a generation. The officers who survived them know what worked and what did not, and the army must choose which of their lessons to build on."
  ENG_learn_from_the_great_war_tt:0 "§YOne§! of the following lessons joins §YThe Royal Army§!:"
  ENG_great_war_camouflage_option_tt:0 "§YCamouflage and concealment§!:"
  ENG_great_war_big_guns_option_tt:0 "§YThe big guns§!:"
  ENG_great_war_night_option_tt:0 "§YNight infiltration§!:"
  ENG_royal_army_dm:0 "The Royal Army"
  ENG_add_royal_army_tt:0 "Adds §YThe Royal Army§!, which gains the following:"
  ENG_modify_royal_army_tt:0 "Modifies §YThe Royal Army§! by:"
  ENG_royal_armoured_corps_1:0 "Royal Armoured Corps"
  ENG_royal_armoured_corps_1_desc:0 "Our tank designs are built on common, proven components, keeping armour cheap to produce."
  ENG_enemy_army_bonus_air_superiority_factor_tt:0 " $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: $RIGHT|-=%1$"
  ENG_railway_gun_bombardment_factor_tt:0 " $MODIFIER_RAILWAY_GUN_BOMBARDMENT_FACTOR$: $RIGHT|+=%1$"
  ENG_training_time_army_factor_tt:0 " $MODIFIER_TRAINING_TIME_ARMY_FACTOR$: $RIGHT|-=%1$"
  ENG_red_berets_tech:0 "The Red Berets"
  ENG_red_berets_tech_desc:0 "Our special forces train and fight as elite raiding troops."
  britain.718.t:0 "Lessons of the Great War"
  britain.718.d:0 "The generals who led our army through 1914 to 1918 have argued over its lessons for twenty years. Some want our soldiers to disappear from the eyes of enemy aircraft, some want the heaviest guns money can buy, and some swear by the trench raids that took the enemy by surprise in the dark.\n\nThe War Office can only build its training around one of them."
  britain.718.a:0 "Teach every unit to hide from the air."
  britain.718.b:0 "Bring back the big guns."
  britain.718.c:0 "Own the night."
  ENG_red_berets_sf_equipment_tt:0 "§RAll special forces battalions will require [?sf_per_battalion|0] more Special Forces Equipment§! (§YTotal Need/Total Stockpile:§! [?total_unit|R0]/[?sf_equipment_stored|R0])"
  ENG_raf_dm:0 "His Majesty's Royal Air Force"
  ENG_add_raf_tt:0 "Adds §YHis Majesty's Royal Air Force§!, which gains the following:"
  ENG_modify_raf_tt:0 "Modifies §YHis Majesty's Royal Air Force§! by:"
  ENG_raf_tactical_bombers_1:0 "RAF Tactical Bombers"
  ENG_raf_tactical_bombers_1_desc:0 "Tactical bomber designs refined for the RAF."
  ENG_raf_strategic_bombers_1:0 "RAF Bomber Command"
  ENG_raf_strategic_bombers_1_desc:0 "Heavy bombers built for long-range raids."
  ENG_raf_fighter_production_1:0 "Fighter Material Mixing"
  ENG_raf_fighter_production_1_desc:0 "Wood, fabric and metal alike go into our fighters, keeping them cheap to build."
  ENG_raf_aircraft_production_group:0 "London Aircraft Production Group"
  ENG_raf_aircraft_production_group_desc:0 "Pooled London factories turn out fighters at lower cost."
  ENG_raf_close_air_support_1:0 "RAF Close Air Support"
  ENG_raf_close_air_support_1_desc:0 "Ground attack aircraft built to work with the army."
  ENG_raf_fleet_air_arm_1:0 "Fleet Air Arm"
  ENG_raf_fleet_air_arm_1_desc:0 "Naval aircraft built for the Royal Navy's carriers and coastal squadrons."
  ENG_strategic_bomb_visibility_tt:0 " Strategic Bomber Visibility: $RIGHT|-=%1$"
  strategic_bomb_visibility:0 "Strategic Bomber Visibility"
  MODIFIER_STRATEGIC_BOMB_VISIBILITY:0 "Strategic Bomber Visibility"
  ENG_mio_trait_sten_submachine_guns_desc:0 "A cheap, simple submachine gun that any workshop in the country can build, putting close-range firepower into every section."
  ENG_prepare_the_beaches:0 "Prepare the Beaches"
  ENG_prepare_the_beaches_desc:0 "Should an enemy ever cross the Channel, they must be met on the sand. Pillboxes, wire and coastal batteries will ring our shores."
  ENG_prepare_the_beaches_idea:0 "Beach Defences"
  ENG_prepare_the_beaches_idea_desc:0 "Engineers and volunteers are fortifying every beach an invader might use."
  ENG_develop_new_tin_openers:0 "Develop New Tin Openers"
  ENG_develop_new_tin_openers_desc:0 "German armour grows thicker every year, and our infantry needs the weapons and drills to crack open an enemy tank. Major Jefferis's PIAT, a spring-fired projector one man can carry, will give every section a fighting chance against armour."
  ENG_womens_auxiliary_army_corps:0 "The Women's Auxiliary Army Corps"
  ENG_womens_auxiliary_army_corps_desc:0 "Women serving as drivers, clerks, signallers and mechanics free thousands of men for the front and keep the army's support services running."
  ENG_develop_the_sten_gun:0 "Develop the Sten Gun"
  ENG_develop_the_sten_gun_desc:0 "A submachine gun simple enough to be built in any workshop in the country will put firepower into every soldier's hands."
  ENG_develop_the_17_pdr:0 "Develop the 17-pdr"
  ENG_develop_the_17_pdr_desc:0 "The 17-pounder anti-tank gun will be able to defeat any tank the enemy can put into the field."
  ENG_neutrality_acts:0 "The Neutrality Acts"
  ENG_neutrality_acts_desc:0 "Congress has bound the United States to stay out of foreign quarrels. American firms may still sell to us, but only on harsh terms, and every ton of American material costs us dearly."
  ENG_neutrality_acts_tt:0 "£trade_texticon Buying resources from the §YUnited States§! is §Rgreatly restricted§!.\nThese terms last until France falls or the §YUnited States§! goes to war."
  ENG_neutrality_acts_eased_tt:0 "£trade_texticon Buying resources from the §YUnited States§! is §Ysomewhat restricted§!.\nThese terms last until France falls or the §YUnited States§! goes to war."
  ENG_industrial_legacy_dm:0 "Industrial Legacy"
  ENG_industrial_legacy_dm_desc:0 "The nation that built the first railways still knows how to raise factories, roads and power lines faster than anyone."
  ENG_add_industrial_legacy_tt:0 "Adds §YIndustrial Legacy§!, which gains the following:"
  ENG_modify_industrial_legacy_tt:0 "Modifies §YIndustrial Legacy§! by:"
  ENG_state_of_the_empire:0 "State of the Empire"
  ENG_state_of_the_empire_desc:0 "Trade Mechanic: while we control both of the listed strongholds and the Suez Canal stays open, our trade gains its full bonus. Losing either one, or seeing the canal blocked, turns the bonus into a penalty, and losing both deepens it.\n§YGibraltar\nSuez Canal (West Suez and East Suez)§!"
  armor_tt_name:0 "Tanks"
