l_english:

  # Foreign Policy

  ENG_appeasement:0 "Appeasement"
  ENG_appeasement_desc:0 "In order to buy us time to rearm, we must make concessions to Germany."
  ENG_containment:0 "Containment"
  ENG_containment_desc:0 "Austria will not be the last. We will take the unpopular road of standing up to Berlin now, paying the price at home while we prepare for the war that is surely coming."

  # Left Side Economy

  ENG_develop_can:0 "Develop Canada"
  ENG_develop_can_desc:0 "We will invest in Canada's industries and infrastructure to transform it into a key pillar of the Empire. A stronger Canada means a stronger foundation for our global power."
  ENG_develop_saf:0 "Develop South Africa"
  ENG_develop_saf_desc:0 "We will direct resources into South Africa to expand its industrial base and strategic importance. Its development will ensure a firmer grip on our southern flank."
  ENG_develop_raj:0 "Develop India"
  ENG_develop_raj_desc:0 "We shall boost economic and infrastructural growth in India, unlocking its vast potential. A more prosperous Raj strengthens the Empire’s core in the East."
  ENG_develop_ast:0 "Develop Australia"
  ENG_develop_ast_desc:0 "We will develop Australia's industries and fortify its role within the Empire. A robust Australia will help secure our interests across the Pacific."
  ENG_develop_nzl:0 "Develop New Zealand"
  ENG_develop_nzl_desc:0 "We will invest in New Zealand’s economy and infrastructure to better support the Empire. A thriving New Zealand bolsters our strategic reach."
  ENG_imperial_defense_conference:0 "Imperial Defense Conference"
  ENG_imperial_defense_conference_desc:0 "We will convene our dominions and colonies to coordinate defense strategies. Unity and cooperation across the Empire are vital for facing the challenges ahead."
  ENG_imperial_defense_conference_pick_tt:0 "Each of our §YDominions§! picks §YONE§! of the following national spirits:"

  # Right Side Economy

  ENG_shadow_scheme:0 "Shadow Scheme"
  ENG_shadow_scheme_desc:0 "Through covert initiatives, we will disrupt enemy supply chains and gain economic advantages. Intelligence is a weapon in the fight for industrial dominance."
  ENG_develop_the_empire:0 "Commonwealth Economic Development"
  ENG_develop_the_empire_desc:0 "The dominions are rich in land and raw materials but poor in factories. A programme of imperial investment directed from London will bring their industry and infrastructure up to modern standards."

  # Centre Economy

  ENG_general_rearmament:0 "General Rearmament"
  ENG_general_rearmament_desc:0 "We must expand all branches of our armed forces, for the war to come will likely be a global, expensive and industrialised conflict on a scale never seen before."
  ENG_air_production_group:0 "London Aircraft Production Group"
  ENG_air_production_group_desc:0 "London Transport's engineers and the capital's coachbuilders will pool their workshops into a single aircraft production group, while posters across the country promise an air force mightier yet."

  # Postwar Economy

  ENG_arms_purchases:0 "Emergency Arms Purchases"
  ENG_arms_purchases_desc:0 "American factories can turn out rifles, guns and lorries faster than our own. Purchasing commissions will cross the Atlantic with orders for whatever our army lacks, paid in hard cash."
  ENG_tizard_mission:0 "Tizard Mission"
  ENG_tizard_mission_desc:0 "Sir Henry Tizard will cross the Atlantic with a black box holding our most precious secrets, the cavity magnetron among them. Sharing them with the Americans will buy goodwill, and access to the factories that can build them in numbers."
  ENG_destroyers_for_bases:0 "Destroyers for Bases"
  ENG_destroyers_for_bases_desc:0 "The Royal Navy is desperately short of escorts, and the Americans have dozens of old destroyers laid up. In return, Washington wants our bases from Newfoundland to the Caribbean."
  ENG_anglo_soviet_agreement:0 "A Deal with the Devil"
  ENG_anglo_soviet_agreement_desc:0 "Stalin is no friend of ours, but he is fighting our enemies. If Hitler invaded Hell, we would make at least a favourable reference to the Devil in the House of Commons, and a pact with Moscow is the least we can do."
  ENG_soviet_lend_lease:0 "Aid the Reds"
  ENG_soviet_lend_lease_desc:0 "The Red Army is losing tanks, guns and lorries faster than its factories can replace them. Arctic convoys and the Persian Corridor will carry British war material to Russia; every German division tied down in the east is one that will not face us."
  ENG_operation_countenance:0 "Operation Countenance"
  ENG_operation_countenance_desc:0 "The Trans-Iranian Railway runs from the Gulf to the Caspian, the safest road for supplies into Russia. Moscow will be invited to occupy Iran alongside us before German agents can turn the Shah's government against us."
  ENG_exploit_iran:0 "Exploit Iran"
  ENG_exploit_iran_desc:0 "With Iran under Allied control, the oil fields of Khuzestan and the roads of Fars are ours to run. New workshops along the supply corridor will turn the country into an arsenal for the Middle East."

  #### Army Tree ####################

  ENG_equip_exiles:0 "Exile Training"

  # Inf Tree
  ENG_home_guard:0 "Form the Home Guard"
  ENG_home_guard_desc:0 "The home islands need to be protected!"
  ENG_equip_foreign_exiles:0 "Equip the French Exiles"
  ENG_equip_foreign_exiles_desc:0 "Thousands of French soldiers have reached our shores with little more than the uniforms they stand in. Rifles, kit and a crash course in our drill will have them back in the fight within weeks."
  ENG_expand_the_army:0 "Expand the Army"
  ENG_expand_the_army_desc:0 "We shall begin a broad recruitment and mobilization campaign to grow our armed forces. A larger army will be essential to hold the frontlines and project power across multiple theatres of war."

  # Tank Tree
  ENG_develop_FV201:0 "Develop the FV201"
  ENG_develop_FV201_desc:0 "Our heavy tanks still lack the punch of the best enemy armour. The FV201 will start from a clean sheet: a heavy chassis big enough to carry a gun that can kill anything on the battlefield."
  ENG_develop_centurion:0 "Develop the Centurion"
  ENG_develop_centurion_desc:0 "The A41 Centurion promises the armour of an infantry tank with the speed of a cruiser. If it succeeds, the army can stop building two kinds of tank for one job."

  # SF Tree
  ENG_commandos:0 "The Red Berets"
  ENG_commandos_desc:0 "Parachute troops dropped behind the lines can seize bridges and airfields before the enemy knows they are there. Our airborne battalions will wear the maroon beret and earn the name the enemy will give them: the Red Devils."

  ### Fortify branch

  ENG_defend_the_empire:0 "Defend the Empire"
  ENG_defend_the_empire_desc:0 "From Gibraltar to Singapore, the Empire's lifelines run through a chain of bases and coaling stations. Each of them must be made strong enough to hold until the fleet arrives."
  ENG_burma_road:0 "The Burma Road"
  ENG_burma_road_desc:0 "Japan's blockade has cut China off from the sea. Improving the mountain road from Lashio to Kunming will keep supplies flowing to Chongqing, whatever Tokyo thinks of it."
  ENG_singapore_strategy:0 "The Singapore Strategy"
  ENG_singapore_strategy_desc:0 "The Royal Navy cannot be everywhere at once. Singapore must be able to hold out alone until the Main Fleet arrives from home, behind guns and forts that make any assault a costly one."
  ENG_malta_east:0 "Gibraltar of the East"
  ENG_malta_east_desc:0 "Singapore will become the Gibraltar of the East: a great naval base with its own fuel stores, airfields and anti-aircraft guns, able to shelter the whole Eastern Fleet."
  ENG_direct_administration:0 "Integrate the Colonial Administration"
  ENG_direct_administration_desc:0 "Malaya is a patchwork of Straits Settlements, Federated States and sultanates, each with its own residents and councils. Bringing them under a single administration will make the peninsula far easier to govern and to defend."
  ENG_fortify_the_med:0 "The Mediterranean Strategy"
  ENG_fortify_the_med_desc:0 "The Mediterranean is the Empire's shortest road to India. Gibraltar, Malta, Cyprus and Egypt must be linked by better roads and guarded against air attack before Rome decides the sea is Mare Nostrum."
  ENG_fortify_suez:0 "Fortify Egypt"
  ENG_fortify_suez_desc:0 "Whoever holds the Suez Canal holds the Empire by the throat. A fortified line at El Alamein and new airfields around Alexandria will keep Egypt in British hands."
  ENG_suez_base:0 "Base the Fleet at Alexandria"
  ENG_suez_base_desc:0 "Alexandria lies safely beyond the reach of most Italian bombers. Basing the Mediterranean Fleet there, behind new docks, airfields and guns, will keep it ready to strike from a secure harbour."
  ENG_malta_base:0 "Base the Fleet at Malta"
  ENG_malta_base_desc:0 "Malta lies in the middle of the Mediterranean, astride Italy's routes to Libya. Keeping the fleet at Grand Harbour under guns and fighter cover will make the island a permanent thorn in Mussolini's side."
  ENG_scramble:0 "Scramble from Africa"
  ENG_scramble_desc:0 "El Alamein has fallen and the desert army is cut off. Every unit in the Middle East will fall back as fast as it can and save what it can, whatever the cost in men and kit."

  # Spy branch
  ENG_assasinate_heydrich:0 "Operation Anthropoid"
  ENG_assasinate_heydrich_desc:0 "We will launch operation Anthropoid, a clandestine mission to kill Reinhard Heydrich in Prague. Czech resistance fighters will carry out the raid, ensuring that their homeland will no longer be plagued by that terrible monster."
  ENG_international_agency:0 "An International Agency"
  ENG_international_agency_desc:0 "Establish a covert international intelligence agency to coordinate espionage efforts across borders. We shall strengthen our networks and share vital information to outmaneuver our enemies."

  ### Naval Tree

  ENG_reform_navy:0 "A Change in Course"
  ENG_reform_navy_desc:0 "The practices and doctrine that have won us the previous wars are now outdated, and we must accept that. In order to also prevail over the threats to come, we are forced to innovate, replace and modernise all of our existing naval structures."
  ENG_stick_our_guns:0 "Britannia Rules the Waves"
  ENG_stick_our_guns_desc:0 "We shall remain loyal to our tried and tested doctrines, resisting radical overhauls. Stability and tradition have always guided the Royal Navy's strength."
  ENG_legacy_jutland:0 "Legacy of Jutland"
  ENG_legacy_jutland_desc:0 "The lessons of Jutland still echo through our naval command. We will honour that legacy and use its experience to shape future engagements."
  ENG_divert_funding:0 "Divert Airforce Funding"
  ENG_divert_funding_desc:0 "We will temporarily redirect air force funding to support our navy’s modernization. Sea power remains Britain’s first and last line of defence."
  ENG_modernise_shipyards:0 "Modernise the Shipyards"
  ENG_modernise_shipyards_desc:0 "Modernizing our shipyards with advanced tools and techniques will accelerate ship production and boost construction efficiency."
  ENG_keep_old_guard:0 "Keep the Old Guard"
  ENG_keep_old_guard_desc:0 "We will preserve the leadership and traditions that have served the Royal Navy well for generations. Their experience is too valuable to cast aside."
  ENG_thicker_armour:0 "Thicker Armour"
  ENG_thicker_armour_desc:0 "We will reinforce our ships with heavier armor plating to better withstand enemy fire. Survivability is the cornerstone of naval supremacy."
  ENG_form_watu:0 "Form WATU"
  ENG_form_watu_desc:0 "The formation of the Western Approaches Tactical Unit will revolutionize our naval warfare strategy. Through tactical training and analysis, we will outsmart any foe."
  ENG_better_torpedo:0 "Modern Torpedoes"
  ENG_better_torpedo_desc:0 "We will invest in the development of more reliable and powerful torpedoes. A single strike from beneath the waves can decide the outcome of a battle."
  ENG_expand_repair_facilities:0 "Expand Repair Facilities"
  ENG_expand_repair_facilities_desc:0 "Expanding our naval repair infrastructure will keep our fleets operational longer and reduce downtime after combat."
  ENG_new_officers:0 "Replace the Old Guard"
  ENG_new_officers_desc:0 "It's time for new leadership within the Royal Navy—officers who embrace innovation and adaptability will carry us to victory."
  ENG_focus_cruiser:0 "Focus on Cruisers"
  ENG_focus_cruiser_desc:0 "Cruisers are the workhorses of our fleet. We shall emphasize their development to ensure fast, reliable power projection."
  ENG_focus_carrier:0 "Focus on Carriers"
  ENG_focus_carrier_desc:0 "Aircraft carriers represent the future of naval warfare. We will prioritize their production and integrate them into our naval doctrine."
  ENG_naval_investments:0 "Increase the Naval Budget"
  ENG_naval_investments_desc:0 "To remain a global naval power, we must allocate additional resources to our fleet. The sea is our domain, and we will rule it."
  ENG_perfect_cruisers:0 "Perfect Cruiser Designs"
  ENG_perfect_cruisers_desc:0 "By refining cruiser designs, we will create the most balanced and lethal ships afloat: Powerful, fast, and dependable."
  ENG_perfect_carriers:0 "Perfect Our Doctrine"
  ENG_perfect_carriers_desc:0 "Our carriers will learn to fly in any weather, day or night, from North Atlantic gales to Indian Ocean monsoons. A carrier that can always launch its aircraft can guard every corner of the Empire."

  ### Air Tree

  ENG_raf:0 "His Majesty's Royal Air Force"
  ENG_raf_desc:0 "The Royal Air Force has outgrown its days as the junior service. Expanding its squadrons and putting its cause before the public in a Wings of Victory campaign will bring it the men and money it needs."
  ENG_research_funding:0 "Increased Research Funding"
  ENG_research_funding_desc:0 "A nation's strength is increasingly tied to its scientific and technological prowess. We will significantly increase the budget allocated to military and industrial research, fostering a new era of innovation."
  ENG_destroy_from_above:0 "Overwhelming Air Superiority"
  ENG_destroy_from_above_desc:0 "Fighter-bombers armed with cannon, bombs and rockets will circle above the battlefield in a cab rank, ready to strike any tank or column the moment the troops below call for it."
  ENG_air_support:0 "Dedicated Air Support"
  ENG_air_support_desc:0 "Our ground forces require unwavering aerial assistance. We will train specialized air wings and develop aircraft explicitly designed for close air support, providing devastating assistance to our troops on the battlefield."
  ENG_new_designs:0 "Next-Gen Design Initiatives"
  ENG_new_designs_desc:0 "Hawker's designers want to turn their fighters into ground-attack aircraft armed with cannon and rockets. Generous contracts will let them build the strike planes our army needs."
  ENG_cutting_edge_designs:0 "Pioneering Edge Design"
  ENG_cutting_edge_designs_desc:0 "The Fleet Air Arm's Swordfish is a slow canvas biplane in an age of monoplanes. Fairey and Blackburn will be pushed to give our carriers strike aircraft fit for the coming war."
  ENG_establish_FAA:0 "Establish Fleet Air Arm"
  ENG_establish_FAA_desc:0 "The Royal Navy's air power must be formally organized and expanded. Establishing a dedicated Fleet Air Arm will ensure our naval aviation capabilities are cohesive, modern, and highly effective in sea-based operations."
  ENG_adopt_changing_world:0 "Adapt to a Changing Landscape"
  ENG_adopt_changing_world_desc:0 "Naval warfare is in flux, and the nature of carrier warfare is evolving rapidly. We must critically assess our existing military doctrines and industrial strategies, adapting swiftly to the emerging realities of the coming global conflict."

  #### EVENTS ####
  britain.500.t:0 "Anglo-Soviet Agreement"
  britain.500.d:0 "Anglo-Soviet Agreement"
  britain.500.a:0 "Accept"
  britain.500.b:0 "Refuse"
  britain.501.t:0 "Operation Countenance"
  britain.501.d:0 "The British propose a combined invasion of Iran."
  britain.501.a:0 "Accept"
  britain.501.b:0 "Refuse"
  britain.502.t:0 "Soviets Accept"
  britain.502.d:0 "Soviets Accept"
  britain.502.a:0 "Launch the Invasion"
  britain.503.t:0 "Soviets Reject Plans"
  britain.503.d:0 "Soviets Reject Plans"
  britain.503.a:0 "Invade anyway"
  britain.503.b:0 "Back down"
  britain.504.t:0 "Preemptive Strike"
  britain.504.d:0 "We have received Intelligence that Italy will soon join the German side. We have the casus belli and the capability to strike them now, and should take advantage of it."
  britain.504.a:0 "Ok"
  britain.700.t:0 "Imperial Defense Conference"
  britain.700.d:0 "We will hold a conference with our colonies to discuss a common defense strategy."
  britain.700.a:0 "Let us specialise in Tanks."
  britain.700.b:0 "Let us specialise in Infantry."
  britain.700.c:0 "Let us specialise in Airpower."
  britain.700.e:0 "We will instead diversify our army."
  britain.710.t:0 "Britain Invites Us Back into the Naval Treaties"
  britain.710.d:0 "The British Ambassador has delivered a proposal from London. Should we once again accept the limits of the naval treaties, Britain will lift the trade embargo it has imposed upon us. Refusing would leave the embargo in place, and London has hinted that it would then consider itself free of the treaty as well."
  britain.710.a:0 "We will rejoin the treaties."
  britain.710.b:0 "Italy will build the fleet it needs."
  britain.711.t:0 "Italy Rejoins the Naval Treaties"
  britain.711.d:0 "Rome has accepted our proposal and once again bound itself to the limits of the naval treaties. As promised, our embargo on Italian trade will be lifted."
  britain.711.a:0 "A sensible decision."
  britain.712.t:0 "Italy Refuses the Naval Treaties"
  britain.712.d:0 "Rome has rejected our proposal outright and will continue to build its fleet without restriction. With Italy free to build as it pleases, many in the Admiralty argue that there is little reason for us to remain bound by the treaty."
  britain.712.a:0 "Then we are no longer bound either."
  britain.712.b:0 "We will honour the treaty regardless."
  britain.713.t:0 "Britain Proposes a Naval Agreement"
  britain.713.d:0 "London has offered to recognise our right to rebuild the Kriegsmarine, on the condition that our battle fleet remains strictly limited in size. Accepting would ease tensions with Britain but make every new battleship a costly undertaking. Refusing leaves our shipyards free, though the British are certain to answer by preparing their own economy for war."
  britain.713.a:0 "We accept the agreement."
  britain.713.b:0 "Germany will not be bound by British terms."
  britain.714.t:0 "Germany Accepts the Naval Agreement"
  britain.714.d:0 "Berlin has signed the Anglo-German Naval Agreement. The German battle fleet will remain limited, leaving the Royal Navy unchallenged in the heavy ships that matter most."
  britain.714.a:0 "Peace in our time on the seas."
  britain.715.t:0 "Germany Rejects the Naval Agreement"
  britain.715.d:0 "Berlin has rejected our proposal and will rebuild its navy without restriction. We can no longer rely on diplomacy alone to keep the Royal Navy ahead, and our industry must begin preparing for war."
  britain.715.a:0 "Then we must prepare."
  britain.716.t:0 "Winston the Platypus"
  britain.716.d:0 "The Prime Minister had been looking forward to it for months: a live platypus, a gift from the people of Australia, the first ever to be kept outside its homeland. Named Winston in his honour, the little animal was nursed across the Pacific and the Atlantic aboard the MV Port Phillip.\n\nIt never reached London. Its keeper found it dead days from port. The escort did drop depth charges on a suspected U-boat during the crossing, and that makes a ready explanation. The truth is less convenient: the voyage was mostly calm, and the heat of the tropics and a shortage of the worms it fed on may have killed it long before any German came near.\n\nThe Prime Minister has taken the news badly, and the Cabinet must decide what to tell Canberra and the public."
  britain.716.a:0 "Another innocent victim of the German U-boats."
  britain.716.b:0 "It died in our care. We will say so."

