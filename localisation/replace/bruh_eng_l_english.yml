  ### IDEAS ###

  ENG_the_sun_never_sets_desc:0 "Bases Mechanic: for every base we own that is listed we will receive a bonus\n§YGibraltar\nMalta\nSinai§!" 
  ENG_air_prod:0 "Propaganda Air Production" 
  ENG_great_depression_1:0 "Great Depression"
  ENG_great_depression_1_desc:0 "The Great Depression has made our people reliant on "the dole". The people have rescinded their support of the Labour Party and now the Conservatives are suffering the brunt of a worldwide, economic... "Mr Hitler" seems content on marching straight into the Rhineland, it would appear as if the world is soon to descend into the grasp of anarchy and total war. It is imperative that we recuperate our losses in the hopes of maintaining peace at home, and on a much larger scale."
  ENG_british_fighter_discount:0 "Aircraft Production Group"
  ENG_tank_specialisation:0 "Tank Specialisation"
  ENG_tank_specialisation_desc:0 "By neglecting other parts of our armed forces, we can improve the efficiency of our tank production."
  ENG_inf_specialisation:0 "Infantry Specialisation"
  ENG_inf_specialisation_desc:0 "We will aim to provide vast amounts of Infantry for our allies, so that others may be able to specialise in more elite units."
  ENG_air_specialisation:0 "Airforce Specialisation"
  ENG_air_specialisation_desc:0 "WW1 has already shown the potencial of airplanes and we will therefore aid our allies with a vast airforce to rule the skies."
  ENG_no_specialisation:0 "Army Diversification"
  ENG_no_specialisation_desc:0 "In order to be a truely capable fighting force, we must not limit ourselves to just one area. We will invest in all areas of our armed forces equally."
  ENG_mi6_ns2:0 "MI6"
  enfield:0 "Small Arms Experts"
  ENG_watu_idea:0 "WATU"
  ENG_merchant_navy:0 "Merchant Navy"
  ENG_second_naval_race:0 "A Second Naval Race"
  ENG_second_naval_race_desc:0 "With the treaty era over, every slipway in the country is being pressed into service to keep pace with our rivals."
  ENG_not_a_penny_wasted_idea:0 "Not a Penny Wasted"
  ENG_not_a_penny_wasted_idea_desc:0 "Rather than laying down costly new hulls, the Admiralty is modernising the ships it already has."
  ENG_the_shadow_scheme_tt:0 "We have built §Y[?shadow_scheme_civs_built|0]§! civilian factories so far. For every §Y[?shadow_scheme_civs_per_mil|0]§! of them, the §YUnited Kingdom§! and every commonwealth member gains a building slot and a military factory, up to §Y[?shadow_scheme_max_mils|0]§!. This comes to §G[?shadow_scheme_rounds|0]§! each:"
  ENG_commonwealth_domestic_trade:0 "Commonwealth Trade"
  ENG_commonwealth_domestic_trade_desc:0 "Closer ties within the Commonwealth let Britain buy our goods on favourable terms."
  ENG_deepened_commonwealth_trade:0 "Deepened Commonwealth Trade"
  ENG_deepened_commonwealth_trade_desc:0 "Our economy is bound tightly to Britain's, and British buyers get our goods on the best terms in the Empire."
  ENG_research_exchange_uk:0 "Commonwealth Research Exchange"
  ENG_research_exchange_uk_desc:0 "Scientists from across the Commonwealth share their work with British laboratories."
  ENG_research_exchange_dominion:0 "Commonwealth Research Exchange"
  ENG_research_exchange_dominion_desc:0 "Our scientists work alongside their British and Commonwealth colleagues, sharing their discoveries."
  ENG_commonwealth_attaches:0 "Commonwealth Military Attachés"
  ENG_commonwealth_attaches_desc:0 "British military attachés help our officers learn from the lessons of the wider Commonwealth."
  ENG_centralized_military_command_idea:0 "Centralized Military Command"
  ENG_centralized_military_command_idea_desc:0 "A single command directs the equipment orders of the whole army, cutting waste and duplication."
  ENG_front_occidental_idea:0 "Front Occidental"
  ENG_front_occidental_idea_desc:0 "British support is helping France build up its industry for the war to come."
  ENG_anglo_german_trade_ties:0 "Anglo-German Trade Ties"
  ENG_anglo_german_trade_ties_desc:0 "Trade with Germany brings in the machine tools and materials our builders need. Should we go to war with Germany, this trade will end."
  ENG_anglo_german_trade_ties_war_tt:0 "The spirit is §Rremoved§! if we go to war with §Y[GER.GetNameDef]§!."
  ENG_operation_torch_idea:0 "Operation Torch"
  ENG_operation_torch_idea_desc:0 "The Allies are gathering the shipping for a great landing in North Africa."
  ENG_operation_dracula_idea:0 "Operation Dracula"
  ENG_operation_dracula_idea_desc:0 "Amphibious forces are being prepared to strike at the Japanese from the sea."
  ENG_operation_compass_idea:0 "Operation Compass"
  ENG_operation_compass_idea_desc:0 "The Western Desert Force is organised to strike deep into Italian-held Libya."
  ENG_operation_overlord_idea:0 "Operation Overlord"
  ENG_operation_overlord_idea_desc:0 "The greatest seaborne invasion in history is ready to return the Allies to France."
  ENG_war_premier:0 "War Premier"
  ENG_lessons_from_france_tt:0 "For every §Y[?lessons_from_france_step|0]§! mastery we have in a land doctrine track, up to §Y[?lessons_from_france_max|0]§!, our dominions gain §G[?lessons_from_france_gain|0]§! mastery in that track."
  ENG_lessons_from_france_dominions_tt:0 "Every §YCommonwealth§! member other than §YUK§!"
  ENG_commonwealth_supreme_command_tt:0 "Unlocks the §YCombined Operations§! decisions."
  ENG_commonwealth_armour_idea:0 "Commonwealth Armour Development"
  ENG_commonwealth_armour_idea_desc:0 "British tank designs and expertise are shared freely across the Commonwealth."
  ENG_mio_trait_infantry_support_firepower:0 "Infantry Support Firepower"
  ENG_mio_trait_infantry_support_firepower_desc:0 "Guns better suited to supporting the infantry against enemy positions."
  ENG_mio_trait_infantry_support_armour:0 "Infantry Tank Armour"
  ENG_mio_trait_infantry_support_armour_desc:0 "Thick armour that lets our infantry tanks advance alongside the infantry under fire."
  ENG_mio_trait_vickers_firepower:0 "Improved Tank Guns"
  ENG_mio_trait_vickers_firepower_desc:0 "Better guns give our medium tanks more punch against infantry."
  ENG_mio_trait_vickers_speed:0 "Improved Suspension"
  ENG_mio_trait_vickers_speed_desc:0 "Refined suspension lets our medium tanks move faster across country."
  ENG_mio_trait_bsa_rifles:0 "Birmingham Small Arms"
  ENG_mio_trait_bsa_rifles_desc:0 "The Birmingham Small Arms Company brings its mass-production experience to our rifle and machine gun lines."
  ENG_mio_trait_royal_arsenal_efficiency:0 "Arsenal Efficiency"
  ENG_mio_trait_royal_arsenal_efficiency_desc:0 "Modernised workshops at Woolwich turn out guns faster and cheaper."
  ENG_mio_trait_royal_arsenal_firepower:0 "Improved Shells"
  ENG_mio_trait_royal_arsenal_firepower_desc:0 "Better high-explosive shells and fuses for our field and anti-aircraft guns."
  ENG_their_finest_hour_idea:0 "Their Finest Hour"
  ENG_their_finest_hour_idea_desc:0 "France has fallen and Britain stands alone, but the nation is united in its resolve and its factories work as never before."
  ENG_small_loan:0 "Small American Loan"
  ENG_small_loan_desc:0 "A modest loan from American banks funds extra production, though the repayments weigh on our economy."
  ENG_medium_loan:0 "American Loan"
  ENG_medium_loan_desc:0 "A sizeable loan from American banks funds extra production, though the repayments weigh on our economy."
  ENG_large_loan:0 "Large American Loan"
  ENG_large_loan_desc:0 "A vast loan from American banks funds a great deal of extra production, though the repayments weigh heavily on our economy."
  ENG_loan_repayment:0 "Loan Repayment"
  ENG_loan_repayment_desc:0 "Settling our debts with American banks ties up a large share of our industry until the last payment is made."
  ENG_take_loan:0 "Expand Cash and Carry Purchases"
  ENG_take_loan_desc:0 "Buy more American war material under Cash and Carry, paid for with borrowed money and shipped home in our own hulls. Each further expansion increases both the output it buys and the burden it places on our economy."
  ENG_repay_loan:0 "Settle the Cash and Carry Accounts"
  ENG_repay_loan_desc:0 "Pay off everything owed for our Cash and Carry purchases in one sweeping effort, freeing our economy of the debt once the repayment is complete."
  ENG_research_grants:0 "Research Grants"
  ENG_research_grants_desc:0 "Generous government grants keep our universities and laboratories at the forefront of science."
  ENG_full_employment:0 "Full Employment"
  ENG_full_employment_desc:0 "With every willing hand at work, our factories run at full capacity and the country is at ease."
  ENG_reshuffled_machine_tooling:0 "Reshuffled Machine Tooling"
  ENG_reshuffled_machine_tooling_desc:0 "Machine tools have been moved from the production lines to the construction sites, trading output today for capacity tomorrow."
  ENG_reshuffle_machine_tooling:0 "Reshuffle Machine Tooling"
  ENG_reshuffle_machine_tooling_desc:0 "By moving machine tools from the production lines to the building of new factories, we can expand our industry faster, at the cost of current output."
  ENG_war_economy:0 "War Economy"
  ENG_war_economy_desc:0 "Financing and organising the British war economy."
  ENG_john_maynard_keynes:0 "John Maynard Keynes"
  ENG_keynesian_economist:0 "Keynesian Economist"
  ENG_mil_plan_tt:0 "We have built §Y[?mil_plan_civs_built|0]§! civilian factories so far. For every §Y[?mil_plan_civs_per_mil|0]§! of them we gain a building slot and a military factory, up to §Y[?mil_plan_max_mils|0]§!, spread across our mainland states. This comes to §G[?mil_plan_mils|0]§!:"
  ENG_commonwealth_of_nations_idea:0 "The Commonwealth of Nations"
  ENG_commonwealth_of_nations_idea_desc:0 "As a free and equal member of the Commonwealth, we share in its combined industrial expertise and investment."
  ENG_special_air_service_idea:0 "Special Air Service"
  ENG_tallboys_idea:0 "Tallboys"
  ENG_scramble_from_africa:0 "Scramble from Africa"

