l_english:

 raid_type_ENG_operation_anthropoid:0 "Operation Anthropoid"
 raid_type_ENG_operation_anthropoid_desc:0 "§LCzech partisans have grown in strength and are making increasingly bold advances. In many districts, they effectively control the flow of information, mapping routes of officials and equipment transports. The key to the military administration is Heydrich, who has been coordinating the occupation. To take him out would deal a serious blow to the occupation government.§!"
 raid_target_name_ENG_operation_anthropoid:0 "Reinhard Heydrich in $LOCATION|H$"
 success_modifier_ENG_anthropoid_prague_network:0 "Spy network in §YBohemia§!"
 success_modifier_ENG_anthropoid_prague_network_negative:0 "Weak spy network in §YBohemia§!"
 success_modifier_ENG_anthropoid_prague_network_improvement:0 "- Build up our spy network in §YBohemia§!"
 success_modifier_ENG_anthropoid_prague_network_counterplay:0 "- Root out enemy spy networks in §YBohemia§!"

 tfb_kill_heydrich.1:0 "Heydrich Assassinated"
 tfb_kill_heydrich.1.t:0 "Heydrich Assassinated!"
 tfb_kill_heydrich.1.desc:0 "Heydrich has been killed in an ambush. The partisans have successfully eliminated the key figure in the occupation government, dealing a significant blow to the strenght of the occupation forces."
 tfb_kill_heydrich.1.a:0 "Sic Semper Tyrannis."
 
 tfb_kill_heydrich.2:0 "Heydrich Mortally Wounded"
 tfb_kill_heydrich.2.t:0 "Heydrich Mortally Wounded!"
 tfb_kill_heydrich.2.desc:0 "Heydrich has been mortally wounded in an ambush. The partisans have successfully eliminated the key figure in the occupation government, dealing a significant blow to the strenght of the occupation forces."
 tfb_kill_heydrich.2.a:0 "May he die a slow and painful death."

 tfb_kill_heydrich.3:0 "Heydrich Assassination Attempt"
 tfb_kill_heydrich.3.t:0 "Heydrich Survives Assassination Attempt!"
 tfb_kill_heydrich.3.desc:0 "Heydrich has survived an assassination attempt. The partisans have failed to eliminate the key figure in the occupation government."
 tfb_kill_heydrich.3.a:0 "Hm. We will have to try again."
 tfb_kill_heydrich.3.desc_again:0 "Reinhard Heydrich has cheated death yet again. Once more the ambush was sprung, once more the agents were ready, and once more the man walked away without a scratch. In Prague they are starting to whisper that the Butcher cannot be killed, and in London the Special Operations Executive is starting to wonder the same."
 tfb_kill_heydrich.3.desc_third:0 "Reinhard Heydrich is alive. Again. According to the after-action report, the agents landed in the wrong country, borrowed bicycles to get back to Prague, and arrived at the ambush point just in time to watch Heydrich's car drive past while their Sten gun jammed for the third operation running. One of them reportedly waved. Heydrich waved back. The Gestapo has stopped bothering to investigate these attempts and now simply sends London a polite thank-you card for the free equipment. SOE headquarters would very much like to know whose idea this was."
 tfb_kill_heydrich.blame_the_planner:0 "Who let Jukki plan this?"

 tfb_kill_heydrich.5:0 "Anthropoid Disaster"
 tfb_kill_heydrich.5.t:0 "Operation Anthropoid Ends in Disaster"
 tfb_kill_heydrich.5.desc:0 "Operation Anthropoid has failed in the worst way possible. The drop was spotted, the agents were captured, and under interrogation the Gestapo pulled the names of their contacts out of them one by one. Over the following nights the Germans swept through Prague and the countryside, rolling up resistance cell after resistance cell. Heydrich lives on, and the Czech resistance has been set back by months."
 tfb_kill_heydrich.5.desc_again:0 "Reinhard Heydrich has cheated death yet again, and this time the price was ruinous. The agents were caught almost as soon as they landed, and the Gestapo used what they found on them to crack open one resistance cell after another. The reprisals across Bohemia and Moravia have been brutal, and the few partisans still free want nothing more to do with London's plans."
 tfb_kill_heydrich.5.desc_third:0 "Operation Anthropoid has failed spectacularly, and by now the Germans are expecting us. The transport was greeted at the drop zone by a Wehrmacht brass band, a welcome banner, and a Gestapo officer holding a clipboard with the names of every resistance contact we have ever had, helpfully provided by the operation plan our agents were carrying in their pockets. Heydrich has sent a telegram to London asking if we would like him to pencil in the next attempt. The Czech resistance has asked us, very politely, to stop helping."
 tfb_kill_heydrich.5.a:0 "A catastrophe."

 tfb_kill_heydrich.4:0 "Heydrich Assassinated carrying out his duties"
 tfb_kill_heydrich.4.t:0 "Heydrich Assassinated carrying out his duties"
 tfb_kill_heydrich.4.desc:0 "In a tragic turn of events, Heydrich was assassinated while carrying out his duties. The partisans have successfully eliminated the key figure in the occupation government, dealing a significant blow to the strenght of the occupation forces."
 tfb_kill_heydrich.4.a:0 "Organize a state funeral for the fallen hero."

 heydrich_killed:0 "Heydrich Killed"
 heydrich_killed_tt:0 "Heydrich Killed"
 heydrich_wounded:0 "Heydrich Wounded"
 heydrich_wounded_tt:0 "Heydrich Wounded"

